  - ./scripts/ci/exit_code.sh timeout -k 60 1860 ./scripts/ci/tezt.sh --send-junit
    tezt-junit.xml --without-select-tezts -- 'time_sensitive && /ci_disabled && /slow
    && /extra && /cloud' --color --log-buffer-size 5000 --log-file tezt.log --global-timeout
    1800 --test-timeout 540 --on-unknown-regression-files fail --junit tezt-junit.xml
    --junit-mem-peak 'dd_tags[memory.peak]' --from-record tezt/records/time-sensitive
    --job ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1} --record tezt-results.json --job-count
    1 --retry 1 --record-mem-peak --mem-warn 5_000_000_000 --keep-going --junit-tag
    'dd_tags[tezt-tag.flaky]=flaky' --junit-tag 'dd_tags[tezt-tag.time_sensitive]=time_sensitive'
    --junit-tag 'dd_tags[tezt-tag.slow]=slow' --junit-tag 'dd_tags[tezt-tag.extra]=extra'
    --junit-tag 'dd_tags[tezt-tag.infrastructure]=infrastructure' --junit-tag 'dd_tags[tezt-tag.layer1]=layer1'
    --junit-tag 'dd_tags[tezt-tag.tezos2]=tezos2' --junit-tag 'dd_tags[tezt-tag.etherlink]=etherlink'
    --junit-tag 'dd_tags[tezt-tag.memory_hungry]=memory_hungry'
  - . ./scripts/ci/datadog_send_job_script_step_time.sh || true
  after_script:
  - . ./scripts/ci/datadog_send_job_cache_info.sh 'after'
  variables:
    TEZT_NO_NPX: "true"
  artifacts:
    expire_in: 7 days
    paths:
    - selected_tezts.tsv
    - tezt.log
    - tezt-*.log
    - tezt-results.json
    - tezt-junit.xml
    reports:
      junit: tezt-junit.xml
    when: always
  retry: 2
  parallel: 2
