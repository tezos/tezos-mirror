# Run an Octez smart rollup node, in observer mode, next to an Octez node.
#
# The Octez node uses the latest Octez suite image. The rollup node uses the
# latest standalone rollup node image. The RPC ports listen on 127.0.0.1 only.
#
# A rollup node that starts without a rollup snapshot needs an archive L1 node.
# With the rolling L1 node of this file, import a rollup snapshot first:
#
#   export ROLLUP_ADDRESS=sr1... SNAPSHOT_URL=<L1 snapshot URL>
#   docker compose -f smart-rollup-node.yml up -d node
#   docker compose -f smart-rollup-node.yml exec node octez-client bootstrapped
#   docker compose -f smart-rollup-node.yml run --rm --no-deps rollup-node \
#     octez-smart-rollup-node --endpoint http://node:8732 \
#     snapshot import <rollup snapshot URL> \
#     --data-dir /var/run/tezos/smart-rollup-node
#   docker compose -f smart-rollup-node.yml up -d
#
# The import checks the snapshot against the L1 node. If the L1 node does not
# keep the block at the head level of the snapshot, give an archive L1 node to
# --endpoint. NETWORK defaults to mainnet, HISTORY_MODE to rolling.

services:
  node-config-set:
    container_name: node-config-set
    image: tezos/tezos-bare:latest
    environment:
      - NETWORK=${NETWORK:-mainnet}
      - HISTORY_MODE=${HISTORY_MODE:-rolling}
      - TEZOS_NODE_DIR=/var/run/tezos/node/data
    command: >-
      /bin/sh -c
      "if [ ! -f $$TEZOS_NODE_DIR/config.json ]; then
      octez-node config init --network $$NETWORK --history-mode $$HISTORY_MODE
      --rpc-addr [::]:8732 --allow-all-rpc [::]:8732;
      fi"
    volumes:
      - ./node_data:/var/run/tezos/node

  node-snapshot:
    container_name: node-snapshot
    image: tezos/tezos-bare:latest
    environment:
      - TEZOS_NODE_DIR=/var/run/tezos/node/data
      - SNAPSHOT_URL=${SNAPSHOT_URL:-}
    command: >-
      /bin/sh -c
      'if [ -n "$$SNAPSHOT_URL" ] && [ ! -d $$TEZOS_NODE_DIR/store ]; then
      wget -O /tmp/snapshot "$$SNAPSHOT_URL";
      octez-node snapshot import --force --no-check /tmp/snapshot;
      fi'
    depends_on:
      node-config-set:
        condition: service_completed_successfully
    volumes:
      - ./node_data:/var/run/tezos/node

  node:
    container_name: octez-node-box
    image: tezos/tezos-bare:latest
    hostname: octez-node
    environment:
      - TEZOS_NODE_DIR=/var/run/tezos/node/data
    command: octez-node run ${TEZOS_NODE_OPTIONS:-}
    ports:
      - 127.0.0.1:8732:8732
    volumes:
      - ./node_data:/var/run/tezos/node
    depends_on:
      node-snapshot:
        condition: service_completed_successfully
    restart: on-failure

  rollup-config-set:
    container_name: rollup-config-set
    image: tezos/tezos-bare:octez-smart-rollup-node-latest
    environment:
      - ROLLUP_ADDRESS=${ROLLUP_ADDRESS:?ROLLUP_ADDRESS is required}
    command: >-
      /bin/sh -c
      "if [ ! -f /var/run/tezos/smart-rollup-node/config.json ]; then
      octez-smart-rollup-node init observer config for $$ROLLUP_ADDRESS
      with operators --rpc-addr 0.0.0.0 --rpc-port 8932
      --data-dir /var/run/tezos/smart-rollup-node;
      fi"
    volumes:
      - ./rollup_data:/var/run/tezos/smart-rollup-node

  rollup-node:
    container_name: octez-smart-rollup-node-box
    image: tezos/tezos-bare:octez-smart-rollup-node-latest
    hostname: octez-smart-rollup-node
    command: >-
      octez-smart-rollup-node --endpoint http://node:8732 run
      --data-dir /var/run/tezos/smart-rollup-node
    ports:
      - 127.0.0.1:8932:8932
    volumes:
      - ./rollup_data:/var/run/tezos/smart-rollup-node
    depends_on:
      node:
        condition: service_started
      rollup-config-set:
        condition: service_completed_successfully
    restart: on-failure
